<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">NRP digit 5: perbandingan pretrained dan scratch</title>
  <desc id="desc">AP validasi mask terbaik untuk YOLO26m, ECSeg-L, dan Swin-L dengan pretrained weights dan tanpa pretrained weights.</desc>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2937">NRP 5: pretrained weights vs scratch</text>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">AP mask validasi terbaik per model (skala linear 0 sampai 0,50)</text>
  <circle cx="335" cy="91" r="7" fill="#2563eb"/><text x="350" y="96" font-family="Arial, sans-serif" font-size="14" fill="#374151">Dengan pretrained</text>
  <rect x="510" y="84" width="14" height="14" rx="2" fill="#f97316"/><text x="534" y="96" font-family="Arial, sans-serif" font-size="14" fill="#374151">Tanpa pretrained (scratch)</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="250" y1="120" x2="250" y2="390"/><line x1="350" y1="120" x2="350" y2="390"/>
    <line x1="450" y1="120" x2="450" y2="390"/><line x1="550" y1="120" x2="550" y2="390"/>
    <line x1="650" y1="120" x2="650" y2="390"/><line x1="750" y1="120" x2="750" y2="390"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="250" y="410">0,00</text><text x="350" y="410">0,10</text><text x="450" y="410">0,20</text>
    <text x="550" y="410">0,30</text><text x="650" y="410">0,40</text><text x="750" y="410">0,50</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="end">
    <text x="225" y="169">YOLO26m-seg</text><text x="225" y="264">ECSeg-L</text><text x="225" y="359">Swin-L + Mask2Former</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="351.6" y1="164" x2="584.7" y2="164"/>
    <line x1="254.7" y1="259" x2="695.0" y2="259"/>
    <line x1="250.1" y1="354" x2="576.5" y2="354"/>
  </g>
  <g fill="#2563eb">
    <circle cx="584.7" cy="164" r="8"/><circle cx="695.0" cy="259" r="8"/><circle cx="576.5" cy="354" r="8"/>
  </g>
  <g fill="#f97316">
    <rect x="345.6" y="158" width="12" height="12" rx="2"/><rect x="248.7" y="253" width="12" height="12" rx="2"/><rect x="244.1" y="348" width="12" height="12" rx="2"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="600">
    <text x="598" y="169" fill="#1d4ed8">0,3347</text><text x="267" y="255" fill="#c2410c">0,004737</text>
    <text x="708" y="264" fill="#1d4ed8">0,4450</text><text x="263" y="360" fill="#c2410c">0,000747</text>
    <text x="589" y="359" fill="#1d4ed8">0,3265</text><text x="365" y="169" fill="#c2410c">0,1016</text>
  </g>
  <text x="500" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Evaluator validasi berbeda antar-keluarga; interpretasikan selisih dalam tiap pasangan model.</text>
</svg>
